name: Run Tests on Pull Request

# Two test jobs, because main and a development branch promise different things.
# Anything landing on main must work against the published orca_core, so that
# job installs from the lock and nothing else. A development branch may need
# core work that is not released yet, so that job checks orca_core out beside
# this repo — the pairing lives here, never in a committed [tool.uv.sources]
# entry that would break every other machine.

on:
  pull_request:
    # `edited` catches a retarget: a PR moved onto main must be re-checked
    # against the published core rather than keeping the paired job's verdict.
    types: [opened, synchronize, reopened, edited]

# A new push or edit supersedes the run still going for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  published:
    name: tests (published orca_core, Python ${{ matrix.python }})
    if: github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python this project supports, the one orca_core's CI also
        # runs, and the newest release.
        python: ['3.10', '3.15']
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --locked fails if pyproject.toml and uv.lock disagree, which is what a
      # committed orca_core override looks like however it is spelled.
      # --python pins the matrix's Python; unpinned, the runner image would pick it.
      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}

      # --timeout turns a hung test into a named failure rather than a job
      # that times out fifteen minutes later with no culprit.
      - name: Run tests
        run: uv run --no-sync pytest --timeout=120

  paired:
    name: tests (paired orca_core)
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout orca_ui
        uses: actions/checkout@v4
        with:
          path: orca_ui

      # Prefer an orca_core branch of the same name, else the PR's base, else
      # main: a UI change and the core change it needs share a branch name.
      - name: Pick the orca_core branch to pair with
        id: core
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          for ref in "$HEAD_REF" "$BASE_REF" main; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads \
                 https://github.com/orcahand/orca_core.git "refs/heads/$ref" >/dev/null 2>&1; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "Pairing with orca_core@$ref"
              exit 0
            fi
          done
          echo "No orca_core branch found" >&2
          exit 1

      - name: Checkout orca_core
        uses: actions/checkout@v4
        with:
          repository: orcahand/orca_core
          ref: ${{ steps.core.outputs.ref }}
          path: orca_core

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --locked is the guard here: this job creates the very sibling layout a
      # committed override names, so without it uv would re-lock and pass.
      # Python is pinned on the sync rather than through setup-uv, whose
      # python-version input activates a venv of its own at the workspace root.
      - name: Install dependencies
        working-directory: orca_ui
        run: uv sync --locked --group dev --python 3.10

      # The same layering ./dev does locally: orca_core from the checkout,
      # everything else from the lock.
      - name: Run tests
        working-directory: orca_ui
        run: uv run --no-sync --with-editable ../orca_core pytest --timeout=120

  # Read-only and needs no credentials: every file the guide's catalog names
  # must be in the public bucket, and no guide media may be committed. Without
  # a terminal the script only checks.
  guide-media:
    name: guide media
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check the catalog against the bucket
        run: python3 scripts/guide_media.py
