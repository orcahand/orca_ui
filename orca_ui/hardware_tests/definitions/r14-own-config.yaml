id: r14-own-config
title: Your own config file
group: new
summary: write_standalone_config makes a complete copy that runs the same hand.
steps:
- id: R18a
  title: Standalone copy and a bare copy
  kind: auto
  check: standalone_config
  instructions: The check writes a standalone copy of this hand's model and a bare copy of its packaged config.yaml,
    then (console let go of the hand) connects orca_core with the standalone copy, its max current changed to a value the motor family
    accepts (above every calibration current, unlike the one in force). The copy keeps the model's name, the hand's
    hand.yaml is put back and any hand folder the run created is removed. Nothing moves.
  pass_rule: The copy loads as the model and connects with this hand's folder and calibration at the changed max current; the bare
    copy is refused and points to write_standalone_config.
