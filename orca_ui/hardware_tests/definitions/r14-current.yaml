id: r14-current
title: Holding and the current limit
group: new
summary: Holding a pose stays cool, and the console's current limit caps what the routines draw.
steps:
- id: R7a
  title: Holding a pose
  kind: auto
  check: holding_temperature
  panels:
  - motor_temperatures
  instructions: 'The check holds a mid-flexed pose with torque on for 3 minutes and reads the motor temperatures,
    stopping early (torque off) if a motor warms by 15 °C or reaches 60 °C. It moves the hand: keep it clear and on
    the bench.'
  pass_rule: No motor warms by more than 5 °C. The result names the hottest motors with their current and how far
    each joint is from its target, so a joint pushing against something shows.
- id: R7b
  title: 100 mA limit
  kind: auto
  check: current_limit_respected
  panels:
  - motor_currents
  instructions: 'The check sets max current to 100 mA, sweeps index_mcp once and reads the slack test''s offered
    currents, then puts max current back. It moves the hand: keep it clear and on the bench.'
  pass_rule: Every current the sweep and the slack test command is at most the limit; the measured drive current
    is never held above it (3 readings in a row, or more than 20% of a run, above the limit + 15%); the motors'
    goal-current register reads at most the limit; and the swept joint moved. Readings above the limit are listed.
- id: R7c
  title: Below the sweep's minimum
  kind: auto
  check: sweep_refused_below_minimum
  instructions: The check sets max current to 40 mA, asks the sweep to start, and puts max current back. Nothing
    moves.
  pass_rule: The sweep refuses with a message about the minimum.
