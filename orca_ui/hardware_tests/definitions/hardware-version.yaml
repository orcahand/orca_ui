id: hardware-version
title: Hardware version
group: new
summary: The version comes from a choice for this session, the board, or a config pin, and decides the v2.1 features.
steps:
  - id: A8a
    title: Version and its source are reported
    kind: auto
    check: hardware_version_reported
    instructions: The check reads the version the console resolved for this hand and where it came from.
    pass_rule: A version is shown with its source (session choice, board or pin).
  - id: A8b
    title: The board wins over a pin and says so
    kind: auto
    check: hardware_version_pin
    instructions: >
      The check loads a copy of this hand's config with a pinned version that differs from the board's,
      with the branch's orca_core.
    pass_rule: >
      From orca_core 0.14 the board's version wins over a config.yaml pin (before, the pin won); a warning
      names both values; the packaged config is unchanged.
  - id: A8c
    title: The console asks on a plain adapter
    kind: manual
    instructions: |
      Only for a hand on a plain adapter without a board to ask; otherwise mark this step skipped.
      Connect it, check the header's version select, and pick a version for the session.
    pass_rule: The header reads "hw ? · no board"; a version picked there is in force for this session only and nothing is saved.
