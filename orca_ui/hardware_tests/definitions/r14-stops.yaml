id: r14-stops
title: Stops and torque off
group: new
summary: Every routine lets go of the hand on Stop and E-STOP; the stop time is recorded for every hand, 17-motor
  Dynamixel hands included.
steps:
- id: R6a
  title: Stop during the guided tensioning
  kind: auto
  check: stop_releases_torque
  params:
    operation: guided_tension
    how: stop
  panels:
  - motor_currents
  - operation_log
  applies_to:
    hardware_versions:
    - 210
    - 211
  instructions: 'The check starts the guided tensioning, lets it hold for a few seconds, presses Stop, then times how long it takes to
    end and reads orca_core''s own torque report. The hand''s records are put back. It moves the hand: keep
    it clear and on the bench.'
  pass_rule: It ends within 10 s and orca_core flags no motor as maybe holding (its own torque read-back on
    the way out). The console's torque read comes after its reconnect, which switches torque off itself, so it
    is only recorded.
