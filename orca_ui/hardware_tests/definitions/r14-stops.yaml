id: r14-stops
title: Stops and torque off
group: new
summary: Every routine lets go of the hand on Stop and E-STOP; the stop time is recorded for every hand, 17-motor
  Dynamixel hands included.
steps:
- id: R6a
  title: Stop during the guided tensioning
  kind: auto
  check: stop_releases_torque
  params:
    operation: guided_tension
    how: stop
  panels:
  - motor_currents
  - operation_log
  applies_to:
    hardware_versions:
    - 210
    - 211
  instructions: 'The check starts the guided tensioning, lets it hold for a few seconds, presses Stop, then reads
    torque enable back from every motor and times it. The hand''s records are put back. It moves the hand: keep
    it clear and on the bench.'
  pass_rule: It ends within 10 s, orca_core flags no motor as maybe holding, and every motor reads torque off.
