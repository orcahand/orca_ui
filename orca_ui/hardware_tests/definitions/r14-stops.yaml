  instructions: 'The check starts the calibration, lets it hold for a few seconds, presses Stop, then times how long it takes to
    end and reads orca_core''s own torque report. The hand''s records are put back. It moves the hand: keep it clear
    and on the bench.'
  pass_rule: It ends within 10 s and orca_core flags no motor as maybe holding (its own torque read-back on
    the way out; the console's read after its reconnect is only recorded), and a stopped calibration either
    changed nothing, or left its partial run marked unfinished with the last complete calibration as the
