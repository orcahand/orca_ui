[project]
name = "orca_ui"
version = "0.2.0"
description = "Web UI for the ORCA Hand: live sensor visualization, motor control, and a 3D hand view. Depends on orca_core for hardware communication."
authors = [
    {name = "clemens-chr", email = "cchristoph@student.ethz.ch"},
    {name = "Fabrice Bourquin", email = "fabrice@orcahand.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12",
    "pyserial>=3.5,<4.0.0",
    "pyyaml>=6,<7",
    "numpy>=1.24",
    # MCP server (orca_ui/mcp): agent access to the running backend.
    "mcp>=1.12,<2",
    "httpx>=0.27",
    # 0.4.1 drops the outer loop's i_clamp gain and brings the wrist into the
    # feedback loop; 0.4.0 cannot satisfy this package's imports.
    "orca-core>=0.4.1,<0.5",
]

[project.scripts]
orca-ui = "orca_ui.cli:main"
orca-ui-mcp = "orca_ui.mcp.cli:main"
orca-dev = "orca_ui.core_source:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    # The suite is wait-bound, not CPU-bound; pytest.ini runs it with -n auto.
    "pytest-xdist>=3.8,<4",
]
# Only needed to (re)build the 3D hand asset bundle (scripts/build_hand_bundle.py).
assets = [
    "trimesh>=4.4",
    "fast-simplification>=0.1.9",
]

# No [tool.uv.sources] here on purpose: `uv sync` in a fresh clone installs the
# published orca_core and works on any machine. To develop against a local
# checkout or a branch, use `uv run orca-dev local` / `orca-dev branch <name>`
# — those write the source entry for you, and `orca-dev release` removes it.

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built frontend (orca_ui/webui) is committed to git so plain checkouts
# work without node. Keep it in artifacts anyway so wheels still ship it even
# if it is ever re-gitignored. Set at build level: uv builds the wheel from
# the sdist, so both targets need it.
artifacts = ["/orca_ui/webui/"]

[tool.hatch.build.targets.wheel]
packages = ["orca_ui"]
