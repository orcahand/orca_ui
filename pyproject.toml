[project]
name = "orca_ui"
version = "0.2.0"
description = "Web UI for the ORCA Hand: live sensor visualization, motor control, and a 3D hand view. Depends on orca_core for hardware communication."
authors = [
    {name = "clemens-chr", email = "cchristoph@student.ethz.ch"},
    {name = "Fabrice Bourquin", email = "fabrice@orcahand.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "orca_core",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12",
    "pyserial>=3.5,<4.0.0",
    "pyyaml>=6,<7",
    "numpy>=1.24",
]

[project.scripts]
orca-ui = "orca_ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "httpx>=0.27",
]
# Only needed to (re)build the 3D hand asset bundle (scripts/build_hand_bundle.py).
assets = [
    "trimesh>=4.4",
    "fast-simplification>=0.1.9",
]

# The UI targets orca_core's joint-sensing work. During development it tracks a
# local sibling checkout (which may be ahead of the public branch); on machines
# without one, swap in the git source instead:
#   orca_core = { git = "https://github.com/orcahand/orca_core.git", branch = "feature/joint-sensing" }
[tool.uv.sources]
orca_core = { path = "../orca_core", editable = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_ui"]
# The built frontend (orca_ui/webui) is gitignored but must ship in the wheel.
artifacts = ["orca_ui/webui"]
